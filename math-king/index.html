<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>מלך לוח הכפל</title>
<style>
  :root{
    --bg1:#8fd3f4; --bg2:#fce8b8;
    --wood:#8b5a2b; --wood-dark:#5a3718; --wood-light:#a9713f;
    --awning1:#c0392b; --awning2:#fdf1dc;
    --accent:#ff8c3b; --accent-dark:#e06a1a;
    --green:#2fae5b; --green-dark:#1f8a45;
    --red:#e74c3c;
    --ink:#3a2c1a;
    --card:#fffaf0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Segoe UI","Arial Hebrew","Heebo",Arial,sans-serif;
    background:linear-gradient(180deg,var(--bg1) 0%, var(--bg1) 30%, var(--bg2) 100%);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    overflow-x:hidden; user-select:none; position:relative;
  }

  /* ===== decorative falafel-stand scene (fixed backdrop, purely visual) ===== */
  .scene{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .awning-strip{
    position:absolute; top:0; left:0; right:0; height:38px;
    background:repeating-linear-gradient(90deg, var(--awning1) 0 34px, var(--awning2) 34px 68px);
    box-shadow:0 3px 6px rgba(0,0,0,.2);
  }
  .awning-scallops{ position:absolute; top:38px; left:0; right:0; height:16px; display:flex; }
  .awning-scallops span{
    flex:1 0 34px; height:16px; border-radius:0 0 50% 50%; margin:0 -1px;
  }
  .awning-scallops span:nth-child(odd){ background:var(--awning1); }
  .awning-scallops span:nth-child(even){ background:var(--awning2); }
  .counter{
    position:absolute; left:0; right:0; bottom:0; height:84px;
    background:
      linear-gradient(180deg, var(--wood-light) 0 6px, transparent 6px),
      repeating-linear-gradient(90deg, var(--wood) 0 28px, var(--wood-dark) 28px 30px);
    box-shadow:0 -4px 10px rgba(0,0,0,.25);
  }
  .jars{ position:absolute; top:-14px; left:0; right:0; display:flex; justify-content:space-evenly; }
  .jar{
    width:26px; height:26px; border-radius:50%; border:2px solid rgba(0,0,0,.15);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.2);
    animation:jarBob 2.4s ease-in-out infinite;
  }
  .jar:nth-child(1){ animation-delay:0s; }
  .jar:nth-child(2){ animation-delay:.2s; }
  .jar:nth-child(3){ animation-delay:.4s; }
  .jar:nth-child(4){ animation-delay:.6s; }
  .jar:nth-child(5){ animation-delay:.8s; }
  @keyframes jarBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }

  /* ambient floating motes drifting up through the scene, for a bit of life */
  .floaty{
    position:absolute; bottom:-20px; border-radius:50%; background:rgba(255,255,255,.55);
    animation:floatUpSky linear infinite;
  }
  @keyframes floatUpSky{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-70vh) translateX(20px); opacity:0; }
  }

  /* faint road + crosswalk glimpsed behind the stand, like an alley market stall */
  .road{
    position:absolute; left:0; right:0; top:54px; height:26px;
    background:#8a8a8a;
    background-image:repeating-linear-gradient(90deg, #fff 0 18px, transparent 18px 40px);
    background-position:center; opacity:.5;
  }

  .screen{ position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; padding-bottom:70px; text-align:center; }
  .hidden{ display:none !important; }

  h1{
    display:inline-block; font-size:1.7em; margin:0 0 4px; padding:10px 22px;
    background:var(--wood-dark); color:#ffe9b8; border-radius:8px;
    box-shadow:0 5px 0 var(--wood), 0 8px 14px rgba(0,0,0,.25);
    border:2px solid #4a2c12;
  }
  .subtitle{ font-size:1.05em; opacity:.85; margin:16px 0 22px; max-width:380px; }

  .card{
    background:var(--card); border-radius:20px; padding:22px 20px;
    box-shadow:0 8px 0 #d8c39a, 0 10px 24px rgba(0,0,0,.15);
    max-width:420px; width:100%; border:2px solid #e8d3a8;
  }

  .range-options{ display:flex; gap:10px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
  .range-btn{
    padding:14px 18px; border-radius:14px; border:3px solid var(--wood);
    background:#fff; font-size:1.1em; font-weight:700; cursor:pointer; color:var(--wood-dark);
    min-width:84px;
  }
  .range-btn.selected{ background:var(--accent); color:#fff; border-color:var(--accent-dark); }

  .big-btn{
    margin-top:18px; padding:16px 32px; font-size:1.3em; font-weight:800;
    border:none; border-radius:16px; background:var(--green); color:#fff;
    box-shadow:0 6px 0 var(--green-dark); cursor:pointer;
  }
  .big-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--green-dark); }

  .highscore{ margin-top:14px; font-size:.95em; opacity:.75; }

  /* ===== Game screen ===== */
  #game{ padding:0; padding-bottom:0; justify-content:flex-start; }
  .topbar{
    width:100%; display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; background:var(--wood-dark); color:#fff; font-weight:700; font-size:1.05em;
    position:relative; z-index:2; box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  .stat{ display:flex; align-items:center; gap:6px; }
  .hearts{ letter-spacing:2px; }

  .stand{
    flex:1; width:100%; max-width:520px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:6px 14px 100px; gap:10px; position:relative;
  }

  .day-banner{
    background:var(--accent); color:#fff; padding:6px 16px; border-radius:999px;
    font-weight:700; margin-top:4px; box-shadow:0 3px 0 var(--accent-dark);
  }

  .customer-area{ position:relative; display:flex; flex-direction:column; align-items:center; margin-top:2px; }

  /* row: waiting queue (decorative) — active customer + meter — waiting queue (decorative) */
  .customer-row{ display:flex; align-items:flex-end; justify-content:center; gap:10px; }
  .queue-customer{
    font-size:2.6em; opacity:.45; filter:grayscale(.4) drop-shadow(0 4px 3px rgba(0,0,0,.15));
    transform:translateY(10px);
  }

  .customer-figure{
    position:relative; display:flex; flex-direction:column; align-items:center;
    animation:idleBounce 1.6s ease-in-out infinite;
  }
  @keyframes idleBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
  .torso{
    position:absolute; bottom:-6px; left:50%; transform:translateX(-50%);
    width:64px; height:16px; border-radius:50%;
    background:rgba(0,0,0,.28); filter:blur(2px); z-index:0;
  }
  .avatar{
    position:relative; z-index:1; width:118px; height:118px;
    filter:drop-shadow(0 6px 4px rgba(0,0,0,.2)); transition:transform .15s;
  }
  .avatar svg{ width:100%; height:100%; display:block; }
  .avatar.shake{ animation:shake .35s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }
  .avatar.leave{ animation:leaveAway .5s forwards; }
  @keyframes leaveAway{ to{ transform:translateY(-40px); opacity:0; } }
  .avatar.pop{ animation:popAnswer .4s ease-out; }
  @keyframes popAnswer{ 0%{transform:scale(1);} 35%{transform:scale(1.25,0.8);} 65%{transform:scale(0.92,1.1);} 100%{transform:scale(1);} }
  .avatar.golden{ animation:goldGlow 1s ease-in-out infinite alternate; }
  @keyframes goldGlow{
    from{ filter:drop-shadow(0 6px 4px rgba(0,0,0,.2)) drop-shadow(0 0 5px #ffd93d); }
    to{ filter:drop-shadow(0 6px 4px rgba(0,0,0,.2)) drop-shadow(0 0 18px #ffd93d); }
  }

  .toast{
    position:fixed; left:50%; top:54px; transform:translateX(-50%) translateY(-20px); opacity:0;
    background:var(--wood-dark); color:#ffe9b8; padding:9px 20px; border-radius:999px;
    font-weight:800; z-index:30; box-shadow:0 4px 10px rgba(0,0,0,.35);
    animation:toastPop 2.6s ease-out forwards; white-space:nowrap;
  }
  @keyframes toastPop{
    0%{ opacity:0; transform:translateX(-50%) translateY(-20px); }
    12%{ opacity:1; transform:translateX(-50%) translateY(0); }
    82%{ opacity:1; transform:translateX(-50%) translateY(0); }
    100%{ opacity:0; transform:translateX(-50%) translateY(-10px); }
  }

  .name-tag{
    margin-top:2px; font-size:.85em; font-weight:700; color:var(--wood-dark);
    background:#fff; padding:1px 10px; border-radius:999px; border:1px solid #d8c39a;
  }

  .mood{
    position:absolute; top:-8px; right:-6px; font-size:1.5em; z-index:2;
    background:#fff; border-radius:50%; padding:2px; border:2px solid var(--wood);
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }

  /* juicy correct-answer feedback: shoots the answer's own quantity of balls + big praise text */
  .shot-ball{
    position:absolute; width:13px; height:13px; border-radius:50%; pointer-events:none; z-index:6;
    background:radial-gradient(circle at 35% 30%, #f6d98a, #d9a441 70%, #b97f28);
    border:1.5px solid #7a4a1f;
    animation:shotFly .55s ease-out forwards;
  }
  @keyframes shotFly{ to{ transform:translate(var(--dx), var(--dy)) scale(.5); opacity:0; } }
  .shot-counter{
    position:absolute; left:50%; top:26%; transform:translate(-50%,-50%);
    font-size:1.7em; font-weight:900; color:#fff;
    text-shadow:0 3px 0 var(--wood-dark), 0 5px 10px rgba(0,0,0,.3);
    z-index:8; pointer-events:none; white-space:nowrap;
  }
  .praise-text{
    position:absolute; left:50%; top:38%; transform:translate(-50%,-50%) scale(0);
    font-size:1.8em; font-weight:900; color:#fff; text-shadow:0 3px 0 var(--wood-dark), 0 5px 10px rgba(0,0,0,.3);
    animation:praisePop .9s ease-out forwards; pointer-events:none; z-index:7; white-space:nowrap;
  }
  @keyframes praisePop{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
    30%{ transform:translate(-50%,-55%) scale(1.2); opacity:1; }
    55%{ transform:translate(-50%,-60%) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-95%) scale(0.9); opacity:0; }
  }

  /* vertical segmented patience meter, like a thermometer next to the customer */
  .patience-wrap{
    width:22px; height:112px; background:#241a0e; border-radius:6px;
    border:2px solid var(--wood-dark); position:relative; overflow:hidden;
    display:flex; align-items:flex-end; align-self:flex-end; margin-bottom:2px;
  }
  .patience-bar{ width:100%; background:var(--green); height:100%; transition:height .25s, background .25s; }
  .patience-wrap::before{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(0deg, transparent 0 19px, rgba(0,0,0,.4) 19px 21px);
  }
  .patience-wrap::after{
    content:"🔥"; position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:1em;
  }

  /* order-ticket style bubble, like a note pinned above the stand */
  .bubble{
    direction:ltr; unicode-bidi:isolate;
    background:#fffdf5;
    background-image:repeating-linear-gradient(#fffdf5 0 27px, #f1e6c8 27px 28px);
    border-radius:4px; padding:12px 22px 10px; font-size:1.6em; font-weight:800; margin-bottom:14px;
    position:relative; box-shadow:0 6px 12px rgba(0,0,0,.25);
    transform:rotate(-2deg);
    border-inline-start:4px solid var(--red);
  }
  .bubble::before{
    content:"📌"; position:absolute; top:-16px; left:50%; transform:translateX(-50%) rotate(15deg);
    font-size:1.1em;
  }

  .bins-row{ display:flex; gap:12px; justify-content:center; margin-top:20px; }
  .bin{
    width:44px; height:30px; border-radius:6px 6px 3px 3px; position:relative;
    box-shadow:inset 0 -8px 8px rgba(0,0,0,.3), 0 2px 3px rgba(0,0,0,.25);
  }
  .bin .flag{
    position:absolute; top:-20px; left:50%; transform:translateX(-50%);
    background:#fff; border:1px solid #99a; font-size:.7em; font-weight:800;
    padding:1px 5px; border-radius:2px; white-space:nowrap;
  }
  .bin .flag::after{
    content:""; position:absolute; bottom:-9px; left:50%; margin-left:-1px;
    width:2px; height:9px; background:#7a99b8;
  }

  .choices{
    display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%; max-width:340px; margin-top:24px;
    position:relative; z-index:2;
  }
  .choice-btn{
    aspect-ratio:1; border-radius:50%; font-size:1.5em; font-weight:800; cursor:pointer;
    color:#4a2c12;
    background:radial-gradient(circle at 35% 30%, #f6d98a, #d9a441 70%, #b97f28);
    border:3px solid #8b5a2b; box-shadow:0 6px 0 #7a4a1f, 0 8px 14px rgba(0,0,0,.25);
  }
  .choice-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #7a4a1f; }
  .choice-btn.correct{ background:radial-gradient(circle at 35% 30%, #7bdf9f, var(--green) 70%, var(--green-dark)); color:#fff; box-shadow:0 6px 0 var(--green-dark); }
  .choice-btn.wrong{ background:radial-gradient(circle at 35% 30%, #f29a90, var(--red) 70%, #a83226); color:#fff; box-shadow:0 6px 0 #a83226; }
  .choice-btn:disabled{ opacity:.55; }

  .float-coin{
    position:absolute; font-weight:800; font-size:1.3em; color:var(--green-dark);
    animation:floatUp .8s forwards; pointer-events:none;
  }
  @keyframes floatUp{ to{ transform:translateY(-46px); opacity:0; } }

  #gameover .card{ }
  .fact-list{ text-align:right; font-size:.9em; max-height:120px; overflow-y:auto; margin:10px 0; background:#fff6e5; border-radius:10px; padding:8px 14px; }

  footer{ position:relative; z-index:2; text-align:center; font-size:.8em; opacity:.7; padding:8px; background:var(--wood-dark); color:#ffe9b8; }
</style>
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="floaty" style="left:12%; width:7px; height:7px; animation-duration:10s; animation-delay:0s;"></div>
    <div class="floaty" style="left:30%; width:5px; height:5px; animation-duration:13s; animation-delay:2s;"></div>
    <div class="floaty" style="left:55%; width:8px; height:8px; animation-duration:11s; animation-delay:4s;"></div>
    <div class="floaty" style="left:75%; width:6px; height:6px; animation-duration:14s; animation-delay:1s;"></div>
    <div class="floaty" style="left:88%; width:5px; height:5px; animation-duration:9s; animation-delay:6s;"></div>
    <div class="awning-strip"></div>
    <div class="awning-scallops">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="road"></div>
    <div class="counter">
      <div class="jars">
        <div class="jar" style="background:#c0392b"></div>
        <div class="jar" style="background:#3a9d4a"></div>
        <div class="jar" style="background:#e8c46a"></div>
        <div class="jar" style="background:#6b3fa0"></div>
        <div class="jar" style="background:#f2eadf"></div>
      </div>
    </div>
  </div>

  <!-- Start screen -->
  <div id="start" class="screen">
    <h1>👑 מלך לוח הכפל 👑</h1>
    <div class="subtitle">עמדת דוכן — כל לקוח מבקש תשובה ללוח הכפל. תענו נכון ותקבלו מטבעות, תטעו יותר מדי — והלקוח יעצבן וילך!</div>
    <div class="card">
      <div><strong>עד כמה בלוח הכפל?</strong></div>
      <div class="range-options">
        <button class="range-btn" data-range="5">עד 5</button>
        <button class="range-btn selected" data-range="10">עד 10</button>
        <button class="range-btn" data-range="12">עד 12</button>
      </div>
      <button class="big-btn" id="startBtn">בואו נתחיל! 🥙</button>
      <div class="highscore" id="highscoreLine"></div>
    </div>
  </div>

  <!-- Game screen -->
  <div id="game" class="screen hidden">
    <div class="topbar">
      <div class="stat">🪙 <span id="coins">0</span></div>
      <div class="stat" id="streakStat" style="display:none;">🔥 <span id="streakCount">0</span></div>
      <div class="stat hearts" id="hearts">❤️❤️❤️</div>
    </div>
    <div class="stand">
      <div class="day-banner" id="dayBanner">יום 1</div>
      <div class="customer-area">
        <div class="bubble" id="question">7 × 8 = ?</div>
        <div class="customer-row">
          <span class="queue-customer" id="queueLeft">👵</span>
          <div class="customer-figure">
            <span class="torso" id="torso"></span>
            <div class="avatar" id="avatar"></div>
            <span class="mood" id="mood">🙂</span>
            <span class="name-tag" id="nameTag">רובי</span>
          </div>
          <div class="patience-wrap"><div class="patience-bar" id="patienceBar"></div></div>
          <span class="queue-customer" id="queueRight">🧔</span>
        </div>
      </div>
      <div class="choices" id="choices"></div>
      <div class="bins-row" id="binsRow"></div>
    </div>
  </div>

  <!-- Day complete screen -->
  <div id="dayComplete" class="screen hidden">
    <h1 id="dayCompleteTitle">🎉 יום 1 הושלם!</h1>
    <div class="card">
      <div id="dayStars" style="font-size:2.4em; letter-spacing:4px;">⭐⭐⭐</div>
      <div style="margin-top:10px; font-size:1.1em;">🪙 בונוס יום: +5</div>
      <button class="big-btn" id="nextDayBtn">יום הבא ▶</button>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="gameover" class="screen hidden">
    <h1>הדוכן נסגר...</h1>
    <div class="card">
      <div style="font-size:1.3em;">🪙 סיימת עם <strong id="finalCoins">0</strong> מטבעות</div>
      <div id="worstFacts" style="margin-top:10px;"></div>
      <button class="big-btn" id="restartBtn">שחקו שוב</button>
    </div>
  </div>

  <footer>מלך לוח הכפל — בהשראת מלך הפלאפל הקלאסי 🥙</footer>

<script>
(function(){
  "use strict";

  var HIGH_KEY = "mathKingHighScore";
  var MAX_MISTAKES = 3;      // wrong tries allowed before a customer storms off
  var LIVES_START = 3;
  var CUSTOMERS_PER_DAY = 8;
  var CUSTOMER_EMOJIS = ["🧑","👩","👨","🧕","👴","👵","🧑‍🦱","👩‍🦰","🧔","👱"];
  var BIN_COLORS = ["#c0392b","#3a9d4a","#e8c46a","#8a5a3c"];
  var MOODS = ["🙂","😐","😠","🤬"]; // index = mistakes so far for current customer
  var PRAISE = ["מעולה!","וואו!","כל הכבוד!","מושלם!","יש!!","אלוף/ה!","נכון!"];

  var CHIBI_CHARS = [
    { name:"רובי", unlockAt:0, svg:
      '<svg viewBox="0 0 120 120"><defs>'+
      '<radialGradient id="gRobotBody" cx="38%" cy="30%" r="75%"><stop offset="0%" stop-color="#eef2f8"/><stop offset="60%" stop-color="#cfd8e6"/><stop offset="100%" stop-color="#a3b1c6"/></radialGradient>'+
      '<linearGradient id="gRobotScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3d5075"/><stop offset="100%" stop-color="#1c2536"/></linearGradient>'+
      '<radialGradient id="gRobotEye" cx="40%" cy="35%" r="70%"><stop offset="0%" stop-color="#c8feff"/><stop offset="55%" stop-color="#5fe3ff"/><stop offset="100%" stop-color="#1fa8c9"/></radialGradient>'+
      '</defs>'+
      '<ellipse cx="60" cy="70" rx="40" ry="42" fill="url(#gRobotBody)" stroke="#1e293b" stroke-width="5"/>'+
      '<ellipse cx="46" cy="52" rx="16" ry="9" fill="#fff" opacity=".35"/>'+
      '<rect x="34" y="52" width="52" height="34" rx="10" fill="url(#gRobotScreen)" stroke="#1e293b" stroke-width="4"/>'+
      '<circle cx="48" cy="69" r="7" fill="url(#gRobotEye)"/><circle cx="72" cy="69" r="7" fill="url(#gRobotEye)"/>'+
      '<circle cx="46" cy="67" r="2" fill="#fff"/><circle cx="70" cy="67" r="2" fill="#fff"/>'+
      '<line x1="60" y1="28" x2="60" y2="14" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>'+
      '<circle cx="60" cy="10" r="7" fill="#ff6b5b" stroke="#1e293b" stroke-width="4"/><circle cx="58" cy="8" r="2" fill="#fff" opacity=".7"/>'+
      '<ellipse cx="26" cy="80" rx="9" ry="12" fill="url(#gRobotBody)" stroke="#1e293b" stroke-width="4"/>'+
      '<ellipse cx="94" cy="80" rx="9" ry="12" fill="url(#gRobotBody)" stroke="#1e293b" stroke-width="4"/></svg>' },
    { name:"מיצי", unlockAt:0, svg:

  // ---- persistent progression: lifetime coins unlock new characters forever ----
  var LIFETIME_KEY = "mathKingLifetimeCoins";
  var UNLOCK_KEY = "mathKingUnlocked";

  function loadLifetimeCoins(){
    var v = parseInt(localStorage.getItem(LIFETIME_KEY) || "0", 10);
    return isNaN(v) ? 0 : v;
  }
  function loadUnlocked(){
    try{
      var raw = localStorage.getItem(UNLOCK_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* ignore corrupt storage */ }
    return CHIBI_CHARS.filter(function(c){ return c.unlockAt === 0; }).map(function(c){ return c.name; });
  }
  function saveUnlocked(){ localStorage.setItem(UNLOCK_KEY, JSON.stringify(unlockedNames)); }

  function spawnToast(text){

  function addLifetimeCoins(amount){
    lifetimeCoins += amount;
    localStorage.setItem(LIFETIME_KEY, String(lifetimeCoins));

      if(c.unlockAt > 0 && unlockedNames.indexOf(c.name) === -1 && lifetimeCoins >= c.unlockAt){

  // ---- audio (no external files, tiny beeps) ----
  var actx = null;
  function tone(freq, dur, type, delay){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t0 = actx.currentTime + (delay||0);
      var osc = actx.createOscillator();
      var gain = actx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(0.15, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain).connect(actx.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }catch(e){ /* audio not available, ignore */ }
  }
  function playCorrect(){ tone(660,0.12,"sine",0); tone(880,0.16,"sine",0.1); }
  function playWrong(){ tone(180,0.2,"sawtooth",0); }
  function playStorm(){ tone(140,0.25,"square",0); tone(100,0.3,"square",0.1); }

  // ---- game state ----
  var state = null;

  function factKey(a,b){ return a<=b ? a+"x"+b : b+"x"+a; }

  function buildFactPool(r){
    var pool = [];
    for(var a=1; a<=r; a++){
      for(var b=a; b<=r; b++){ pool.push([a,b]); }
    }
    return pool;
  }

  function pickNextFact(){
    var pool = state.factPool;
    var weights = state.weights;
    var last = state.lastFactKey;
    var total = 0;
    var usable = pool.filter(function(f){ return pool.length===1 || factKey(f[0],f[1]) !== last; });
    usable.forEach(function(f){ total += weights[factKey(f[0],f[1])] || 1; });
    var r = Math.random() * total;
    for(var i=0;i<usable.length;i++){
      var f = usable[i];
      var w = weights[factKey(f[0],f[1])] || 1;
      if(r < w) return f;
      r -= w;
    }
    return usable[usable.length-1];
  }

  function bumpWeight(a,b,ok){
    var k = factKey(a,b);
    var w = state.weights[k] || 1;
    state.weights[k] = ok ? Math.max(1, w - 1) : w + 3;
  }

  function shuffled(arr){
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }

  function genProductChoices(a,b,correct){
    var set = new Set();
    var candidates = [
      a*(b+1), a*(b>1?b-1:b+2), (a+1)*b, (a>1?a-1:a+2)*b,
      a+b, correct+a, correct-a, correct+b, correct-b,
      correct + (Math.random()<0.5?1:-1) * (1+Math.floor(Math.random()*4))
    ];
    candidates.forEach(function(v){ if(v>0 && v!==correct) set.add(v); });
    var arr = shuffled(Array.from(set));
    var wrongs = arr.slice(0,3);
    while(wrongs.length<3){
      var v = correct + (wrongs.length+1)*(Math.random()<0.5?1:-1);
      if(v>0 && v!==correct && wrongs.indexOf(v)===-1) wrongs.push(v);
    }
    return shuffled(wrongs.concat([correct]));
  }

  // for "? × b = product" style questions — the answer is a small factor, not a product
  function genFactorChoices(correct){
    var set = new Set();
    [correct-1, correct+1, correct-2, correct+2, correct-3, correct+3].forEach(function(v){
      if(v >= 1 && v <= range && v !== correct) set.add(v);
    });
    var guard = 0;
    while(set.size < 6 && guard++ < 30){
      var v = 1 + Math.floor(Math.random()*range);
      if(v !== correct) set.add(v);
    }
    var wrongs = shuffled(Array.from(set)).slice(0,3);
    return shuffled(wrongs.concat([correct]));
  }

  function genChoices(c){
    return c.mode === "missing" ? genFactorChoices(c.correct) : genProductChoices(c.a, c.b, c.correct);
  }

  function updateHeader(){
    els.coins.textContent = state.coins;
    els.hearts.textContent = "❤️".repeat(state.lives) + "🖤".repeat(LIVES_START - state.lives);
    els.dayBanner.textContent = "יום " + state.day;
    els.streakCount.textContent = state.streak;
    els.streakStat.style.display = state.streak >= 2 ? "flex" : "none";
  }

  function newCustomer(){
    var fact = pickNextFact();
    var a = fact[0], b = fact[1];
    if(Math.random()<0.5){ var tmp=a; a=b; b=tmp; }
    state.lastFactKey = factKey(a,b);

    var product = a*b;
    var mode = Math.random() < 0.35 ? "missing" : "direct";
    var hideFirst = Math.random() < 0.5;
    var correct = mode === "missing" ? (hideFirst ? a : b) : product;
    var golden = Math.random() < 0.125;
    state.current = { a:a, b:b, product:product, correct:correct, mode:mode, mistakes:0, golden:golden };

    var unlockedPool = CHIBI_CHARS.filter(function(c){ return unlockedNames.indexOf(c.name) !== -1; });
    var character = unlockedPool[Math.floor(Math.random()*unlockedPool.length)];
    els.avatar.innerHTML = character.svg;
    els.avatar.className = "avatar" + (golden ? " golden" : "");
    els.nameTag.textContent = character.name;
    els.queueLeft.textContent = CUSTOMER_EMOJIS[Math.floor(Math.random()*CUSTOMER_EMOJIS.length)];
    els.queueRight.textContent = CUSTOMER_EMOJIS[Math.floor(Math.random()*CUSTOMER_EMOJIS.length)];
    els.mood.textContent = MOODS[0];
    els.question.textContent = mode === "missing"
      ? (hideFirst ? ("? × " + b + " = " + product) : (a + " × ? = " + product))
      : (a + " × " + b + " = ?");
    els.patienceBar.style.height = "100%";
    els.patienceBar.style.background = "";
    renderChoices();

    if(golden) spawnToast("✨ לקוח מוזהב — מטבעות כפולים!");
  }

  // shoots exactly `count` little falafel-ball projectiles from the customer —
  // count = the multiplication answer itself, so kids *see* the quantity
  function shootAnswerBalls(count){
    var rect = els.avatar.getBoundingClientRect();
    var standRect = els.stand.getBoundingClientRect();
    var ox = rect.left - standRect.left + rect.width/2;
    var oy = rect.top - standRect.top + rect.height/2;

    var counter = document.createElement("div");
    counter.className = "shot-counter";
    counter.textContent = "0";
    els.stand.appendChild(counter);

    var totalDuration = Math.min(1100, Math.max(350, count * 20));
    var interval = totalDuration / count;

    for(var i=0;i<count;i++){
      (function(idx){
        setTimeout(function(){
          var b = document.createElement("div");
          b.className = "shot-ball";
          b.style.left = (ox - 6) + "px";
          b.style.top = (oy - 6) + "px";
          var dx = (Math.random()*220 - 110);
          var dy = -(50 + Math.random()*120);
          b.style.setProperty("--dx", dx + "px");
          b.style.setProperty("--dy", dy + "px");
          els.stand.appendChild(b);
          counter.textContent = idx + 1;
          setTimeout(function(){ b.remove(); }, 600);
        }, idx * interval);
      })(i);
    }
    setTimeout(function(){ counter.remove(); }, totalDuration + 700);
  }

  function spawnPraise(text){
    var p = document.createElement("div");

  function celebrate(reward, bigStreak, correctValue){
    flashCoins(reward);
    shootAnswerBalls(correctValue);
    spawnPraise(bigStreak ? ("רצף אש! 🔥×" + state.streak) : PRAISE[Math.floor(Math.random()*PRAISE.length)]);
    els.avatar.classList.add("pop");
    setTimeout(function(){ els.avatar.classList.remove("pop"); }, 400);

  function renderChoices(){
    var c = state.current;
    var choices = genChoices(c);
    els.choices.innerHTML = "";
    choices.forEach(function(val){
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = val;

      els.choices.appendChild(btn);

  function flashCoins(amount){
    var f = document.createElement("div");
    f.className = "float-coin";
    f.textContent = "+" + amount + " 🪙";
    var rect = els.avatar.getBoundingClientRect();
    var standRect = els.stand.getBoundingClientRect();
    f.style.left = (rect.left - standRect.left + rect.width/2 - 20) + "px";
    f.style.top = (rect.top - standRect.top) + "px";
    els.stand.appendChild(f);
    setTimeout(function(){ f.remove(); }, 800);

  function onAnswer(val, btn){
    var c = state.current;
    var buttons = Array.prototype.slice.call(els.choices.children);
    buttons.forEach(function(b){ b.disabled = true; });

    if(val === c.correct){
      btn.classList.add("correct");
      playCorrect();
      bumpWeight(c.a, c.b, true);
      var reward = Math.max(2, 10 - c.mistakes * 3);
      state.streak = (c.mistakes === 0) ? state.streak + 1 : 0;
      var streakMilestone = state.streak > 0 && state.streak % 5 === 0;
      if(streakMilestone) reward += 10;
      if(c.golden) reward *= 2;
      state.coins += reward;
      addLifetimeCoins(reward);
      if(c.mistakes === 0) state.dayClean++;
      state.servedToday++;
      updateHeader();
      celebrate(reward, streakMilestone, c.product);
      els.avatar.classList.add("leave");

      if(state.servedToday >= CUSTOMERS_PER_DAY){
        var completedDay = state.day;
        var starsEarned = state.dayClean >= Math.ceil(CUSTOMERS_PER_DAY*0.875) ? 3
          : (state.dayClean >= Math.ceil(CUSTOMERS_PER_DAY*0.5) ? 2 : 1);
        state.servedToday = 0;
        state.dayClean = 0;
        state.day++;
        state.coins += 5;
        addLifetimeCoins(5);
        updateHeader();
        setTimeout(function(){ showDayComplete(completedDay, starsEarned); }, 550);
      } else {
        setTimeout(function(){
          if(state.gameOver) return;
          newCustomer();
        }, 550);
      }
    } else {
      btn.classList.add("wrong");
      playWrong();
      c.mistakes++;
      bumpWeight(c.a, c.b, false);
      els.avatar.classList.add("shake");
      setTimeout(function(){ els.avatar.classList.remove("shake"); }, 350);

      if(c.mistakes >= MAX_MISTAKES){
        playStorm();
        els.mood.textContent = MOODS[3];
        els.patienceBar.style.height = "0%";
        state.lives--;
        state.streak = 0;
        updateHeader();
        els.avatar.classList.add("leave");
        setTimeout(function(){
          if(state.lives <= 0){ endGame(); }
          else { newCustomer(); }
        }, 650);
      } else {
        els.mood.textContent = MOODS[c.mistakes];
        var pct = Math.max(0, 100 - (c.mistakes/MAX_MISTAKES)*100);
        els.patienceBar.style.height = pct + "%";
        els.patienceBar.style.background = c.mistakes===1 ? "#e0a83a" : "#e05a3a";
        setTimeout(function(){ renderChoices(); }, 500);
      }
    }
  }

  function endGame(){
    state.gameOver = true;
    saveHighScoreIfBetter(state.coins);
    els.finalCoins.textContent = state.coins;

    var worst = Object.keys(state.weights)
      .filter(function(k){ return state.weights[k] > 1; })
      .sort(function(x,y){ return state.weights[y] - state.weights[x]; })
      .slice(0,5)
      .map(function(k){ return k.replace("x"," × "); });

    els.worstFacts.innerHTML = worst.length
      ? "<div style='font-size:.9em;opacity:.8;'>כדאי לתרגל עוד:</div><div class='fact-list'>" + worst.join(" · ") + "</div>"
      : "";

    els.game.classList.add("hidden");
    els.gameover.classList.remove("hidden");
  }

  function showDayComplete(completedDay, stars){
    els.dayCompleteTitle.textContent = "🎉 יום " + completedDay + " הושלם!";
    els.dayStars.textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
    els.game.classList.add("hidden");
    els.dayComplete.classList.remove("hidden");
  }

  function startGame(){
    state = {
      coins: 0, lives: LIVES_START, day: 1, servedToday: 0, streak: 0, dayClean: 0,
      factPool: buildFactPool(range), weights: {}, lastFactKey: null,
      gameOver: false
    };
    updateHeader();
    els.start.classList.add("hidden");
    els.gameover.classList.add("hidden");
    els.dayComplete.classList.add("hidden");
    els.game.classList.remove("hidden");
    newCustomer();
  }

  els.startBtn.addEventListener("click", startGame);
  els.nextDayBtn.addEventListener("click", function(){
    els.dayComplete.classList.add("hidden");
    els.game.classList.remove("hidden");
    newCustomer();
  });
  els.restartBtn.addEventListener("click", function(){
    els.highscoreLine.textContent = "השיא שלך: " + loadHighScore() + " מטבעות";
    els.gameover.classList.add("hidden");
    els.start.classList.remove("hidden");
  });

})();
</script>
</body>
</html>
