<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>הזמנה ליום הולדת כיתתי</title>
<style>
  @font-face { font-family: Rubik; font-weight: 700; src: url(../fonts/rubik-hebrew-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Rubik; font-weight: 500; src: url(../fonts/rubik-hebrew-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Heebo; font-weight: 700; src: url(../fonts/heebo-hebrew-700-normal.woff2) format("woff2"); }
  @font-face { font-family: Heebo; font-weight: 500; src: url(../fonts/heebo-hebrew-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Rubik; font-weight: 700; src: url(../fonts/rubik-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Rubik; font-weight: 500; src: url(../fonts/rubik-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Heebo; font-weight: 700; src: url(../fonts/heebo-latin-700-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: Heebo; font-weight: 500; src: url(../fonts/heebo-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
  html, body { margin: 0; background: #0d0d0d; }
  canvas { display: block; width: 100vw; max-width: 540px; height: auto; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ===== פרטי האירוע — לשנות כאן ולהריץ מחדש את render.mjs =====
const CONFIG = {
  names: ["יאיר", "מיה", "לביא ג.", "לביא", "יאיר", "עלמה"],
  date: "27.10",
  day: "יום שלישי",
  time: "",   // למשל "17:00" — אם ריק, מופיע "שעה ומקום — בקבוצת הכיתה"
  place: "",
};

// Promo-style cut: everything is timed to the music (128 BPM, 1 bar = 1.875s)
const B = 60 / 128, BAR = 4 * B;
const DURATION = 16 * BAR + .5;

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const W = 1080, H = 1920;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const pop = (s, a, d = .28) => easeBack(seg(s, a, a + d));          // scale-in
const beatPulse = t => 1 + .035 * Math.exp(-((t % B) / B) * 6);      // thump on every beat

const NEON = "#e6ff00", PINK = "#ff2e88", BLUE = "#2e5bff", PURPLE = "#7b2eff", INK = "#0d0d0d", WHITE = "#ffffff", GREEN = "#00d26a";
const EMOJI = '"Noto Color Emoji"';

function setFont(size, weight = 700, font = "Rubik") { ctx.font = `${weight} ${size}px ${font}, ${EMOJI}`; }
function text(str, x, y, o = {}) {
  const { size = 80, font = "Rubik", weight = 700, color = WHITE, alpha = 1, scale = 1, rot = 0,
          stroke = null, strokeW = 0, shadow = null, blur = 0, align = "center" } = o;
  if (alpha <= .001 || scale <= .001) return;
  ctx.save();
  ctx.globalAlpha *= clamp(alpha);
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  setFont(size, weight, font);
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.direction = "rtl";
  if (shadow) { ctx.shadowColor = shadow; ctx.shadowBlur = blur; ctx.shadowOffsetY = 8; }
  if (stroke) { ctx.lineJoin = "round"; ctx.lineWidth = strokeW; ctx.strokeStyle = stroke; ctx.strokeText(str, 0, 0); ctx.shadowColor = "transparent"; }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
// text on a marker-style highlight box (the classic "reels caption" look)
function tag(str, x, y, o = {}) {
  const { size = 80, bg = NEON, fg = INK, rot = 0, scale = 1, alpha = 1, pad = .38, radius = 18, shadow = true, font = "Rubik" } = o;
  if (scale <= .001 || alpha <= .001) return;
  setFont(size, 700, font);
  const w = ctx.measureText(str).width + size * pad * 2, h = size * 1.45;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  if (shadow) { ctx.fillStyle = "rgba(0,0,0,.9)"; rrect(-w / 2 + 12, -h / 2 + 12, w, h, radius); ctx.fill(); }
  ctx.fillStyle = bg; rrect(-w / 2, -h / 2, w, h, radius); ctx.fill();
  ctx.restore();
  text(str, x, y + size * .04, { size, color: fg, rot, scale, alpha, font });
}
// rubber-stamp sticker that slams in
function stamp(str, x, y, s, at, o = {}) {
  const { size = 74, color = "#ff1f3d", rot = -.18 } = o;
  const k = seg(s, at, at + .22); if (k <= 0) return;
  const sc = lerp(2.6, 1, easeOut(k));
  setFont(size); const w = ctx.measureText(str).width + 90, h = size * 1.6;
  ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.strokeStyle = color; ctx.lineWidth = 12; rrect(-w / 2, -h / 2, w, h, 20); ctx.stroke();
  ctx.lineWidth = 4; rrect(-w / 2 + 16, -h / 2 + 16, w - 32, h - 32, 12); ctx.stroke();
  ctx.restore();
  text(str, x, y + 4, { size, color, rot, scale: sc, alpha: clamp(k * 2) });
}

// ---------- backgrounds ----------
function stripes(t, color, alpha = .08, gap = 90) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = gap * .35;
  ctx.translate(W / 2, H / 2); ctx.rotate(-.5);
  const off = (t * 120) % gap;
  for (let x = -1600; x < 1600; x += gap) { ctx.beginPath(); ctx.moveTo(x + off, -1600); ctx.lineTo(x + off, 1600); ctx.stroke(); }
  ctx.restore();
}
function dots(color, alpha = .12) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  for (let y = 30; y < H; y += 46) for (let x = (y / 46 % 2) * 23 + 20; x < W; x += 46) { ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.28); ctx.fill(); }
  ctx.restore();
}
function bg(color, t, pattern = "stripes", pc = WHITE) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, W, H);
  if (pattern === "stripes") stripes(t, pc); else if (pattern === "dots") dots(pc);
  // vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.35)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- confetti ----------
const CONF = [NEON, PINK, BLUE, WHITE, "#ff9f1c", GREEN];
function burst(t0, ox, oy, n, seed, spread = 1) {
  const r = rng(seed);
  return Array.from({ length: n }, () => {
    const a = -Math.PI / 2 + (r() - .5) * Math.PI * 1.5 * spread, sp = 1000 + r() * 1700;
    return { t0, ox, oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: r() * 6, vr: (r() - .5) * 16,
             w: 16 + r() * 20, h: 9 + r() * 12, c: CONF[(r() * CONF.length) | 0], sw: r() * 6 };
  });
}
const PARTS = [...burst(2 * BAR, W / 2, 1000, 170, 3), ...burst(14 * BAR + 1.4, W / 2, 1390, 200, 4),
               ...burst(15 * BAR, 150, 1950, 90, 5, .5), ...burst(15 * BAR, 930, 1950, 90, 6, .5)];
function confetti(t) {
  PARTS.forEach(p => {
    const dt = t - p.t0; if (dt < 0 || dt > 4) return;
    const d = 1 - Math.exp(-2.4 * dt);
    const x = p.ox + p.vx / 2.4 * d + Math.sin(dt * 3 + p.sw) * 30 * dt, y = p.oy + p.vy / 2.4 * d + 300 * dt + 200 * dt * dt;
    if (y > H + 40) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + p.vr * dt); ctx.scale(1, Math.cos(dt * 9 + p.sw));
    ctx.globalAlpha = clamp(4 - dt); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  });
}

// ---------- cuts ----------
const CUTS = [];
const cut = (bars, fn) => { const start = CUTS.length ? CUTS[CUTS.length - 1].end : 0; CUTS.push({ start, end: start + bars * BAR, fn }); };

// 1. HOOK
cut(1, (s, t) => {
  bg(INK, t, "stripes", NEON);
  const shake = Math.sin(s * 60) * 14 * (1 - seg(s, 0, .5));
  text("✋", W / 2, 640, { size: 260, scale: pop(s, 0, .3) * beatPulse(t) });
  text("עצרו", W / 2 + shake, 930, { size: 230, color: WHITE, scale: pop(s, .05) });
  tag("הכול!", W / 2 - shake, 1190, { size: 200, bg: NEON, scale: pop(s, B), rot: -.05 });
});
// 2. ANNOUNCEMENT
cut(1, (s, t) => {
  bg(PINK, t, "dots", WHITE);
  text("📣", W / 2, 640, { size: 220, scale: pop(s, 0) * beatPulse(t), rot: Math.sin(t * 8) * .1 });
  text("יש לנו", W / 2, 900, { size: 150, scale: pop(s, .05) });
  tag("הודעה חשובה", W / 2, 1100, { size: 120, bg: INK, fg: NEON, scale: pop(s, B), rot: .04 });
  text("(ממש חשובה)", W / 2, 1290, { size: 60, font: "Heebo", alpha: seg(s, 2 * B, 2 * B + .2) });
});
// 3. DATE
cut(2, (s, t) => {
  bg(INK, t, "stripes", PINK);
  tag("שמרו את התאריך", W / 2, 470, { size: 92, bg: PINK, fg: WHITE, scale: pop(s, 0), rot: -.04 });
  const z = lerp(1.6, 1, easeOut(seg(s, 0, .35))) * beatPulse(t);
  // glitchy RGB split on the date
  const j = s < .5 ? 14 * (1 - s / .5) : 3 * Math.sin(t * 40) * (Math.sin(t * 3) > .9);
  text(CONFIG.date, W / 2 - j, 960, { size: 360, color: "rgba(255,46,136,.9)", scale: z });
  text(CONFIG.date, W / 2 + j, 960, { size: 360, color: "rgba(46,91,255,.9)", scale: z });
  text(CONFIG.date, W / 2, 960, { size: 360, color: NEON, scale: z });
  tag(CONFIG.day, W / 2, 1290, { size: 96, bg: WHITE, fg: INK, scale: pop(s, 2 * B), rot: .03 });
  stamp("ביומן! ✍️", 790, 1560, s, 4 * B, { color: NEON, rot: -.2 });
});
// 4. CLASS BIRTHDAY + NAMES
cut(2, (s, t) => {
  bg(BLUE, t, "dots", WHITE);
  text("חוגגים 🎉", W / 2, 330, { size: 120, scale: pop(s, 0) });
  tag("יום הולדת כיתתי!", W / 2, 520, { size: 118, bg: NEON, fg: INK, scale: pop(s, B), rot: -.03 });
  const colors = [PINK, NEON, WHITE, "#ff9f1c", GREEN, PINK];
  CONFIG.names.forEach((nm, i) => {
    const row = Math.floor(i / 2), col = i % 2;
    const x = col ? 300 : 780, y = 820 + row * 270;
    tag(nm, x, y, { size: 104, bg: colors[i % colors.length], fg: INK, scale: pop(s, 2 * B + i * B * .5, .22) * beatPulse(t + i * .1), rot: (i % 2 ? .05 : -.05) });
  });
  text("כל החוגגים בחגיגה אחת ענקית!", W / 2, 1650, { size: 62, font: "Heebo", alpha: seg(s, 6 * B, 6 * B + .2) });
});
// 5. SECRET ACTIVITY (redacted)
cut(2, (s, t) => {
  bg(INK, t, "stripes", WHITE);
  const dotsN = Math.min(3, Math.floor(s / (B / 2)));
  text("והשנה" + ".".repeat(dotsN), W / 2, 520, { size: 150, scale: pop(s, 0) });
  text("אנחנו עושים", W / 2, 760, { size: 110, alpha: seg(s, 2 * B, 2 * B + .1) });
  // redaction bar wipes across
  const k = easeOut(seg(s, 3 * B, 3 * B + .35));
  if (k > 0) {
    const w = 860 * k, jx = Math.sin(t * 50) * 3;
    ctx.fillStyle = "#000"; rrect(W / 2 + 430 - w + jx, 880, w, 170, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 3; ctx.stroke();
    // glitch slices
    for (let i = 0; i < 5; i++) if (Math.sin(t * 23 + i * 7) > .7) { ctx.fillStyle = [PINK, NEON, BLUE][i % 3]; ctx.fillRect(W / 2 - 430 + ((i * 197 + t * 900) % 800), 890 + i * 30, 70, 8); }
  }
  stamp("מסווג 🤫", W / 2, 965, s, 4.5 * B, { size: 100, color: "#ff1f3d", rot: -.14 });
  tag("👀 תגלו רק ביום החגיגה", W / 2, 1330, { size: 76, bg: NEON, fg: INK, scale: pop(s, 6 * B), rot: .03 });
});
// 6. HINTS — one big word every 2 beats, color flip
const HINTS = [["רמז #1", "איזון", "🤹", PINK], ["רמז #2", "אמון", "🤝", NEON], ["רמז #3", "מרחפים", "✈️", BLUE], ["רמז #4", "צחוק", "😂", PURPLE]];
cut(2, (s, t) => {
  const i = Math.min(3, Math.floor(s / (2 * B))), ls = s - i * 2 * B;
  const [lbl, word, emo, col] = HINTS[i];
  const dark = col === NEON;
  bg(col, t, "dots", dark ? INK : WHITE);
  tag(lbl, W / 2, 470, { size: 80, bg: INK, fg: dark ? NEON : WHITE, scale: pop(ls, 0, .2), rot: -.04 });
  text(emo, W / 2, 800, { size: 240, scale: pop(ls, .05, .25) * beatPulse(t), rot: Math.sin(t * 6) * .08 });
  text(word, W / 2, 1120, { size: 230, color: dark ? INK : WHITE, scale: lerp(1.4, 1, easeOut(seg(ls, 0, .25))) });
  text("נחשתם? 😉", W / 2, 1600, { size: 70, font: "Heebo", color: dark ? INK : WHITE, alpha: i === 3 ? seg(ls, B, B + .15) : 0 });
});
// 7. PARENTS — entry ticket
cut(2, (s, t) => {
  bg(NEON, t, "stripes", INK);
  const shake = Math.sin(s * 70) * 12 * (1 - seg(s, 0, .4));
  text("⚠️ הורים,", W / 2 + shake, 360, { size: 140, color: INK, scale: pop(s, 0) });
  tag("שימו לב!", W / 2, 540, { size: 110, bg: INK, fg: NEON, scale: pop(s, B), rot: -.04 });
  // ticket
  const k = easeBack(seg(s, 2 * B, 2 * B + .4));
  if (k > 0) {
    ctx.save(); ctx.translate(lerp(W + 700, W / 2, k), 1050); ctx.rotate(lerp(.4, -.035, k));
    ctx.fillStyle = "rgba(0,0,0,.9)"; ctx.beginPath(); ticketPath(14, 14); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ticketPath(0, 0); ctx.fill();
    ctx.setLineDash([18, 14]); ctx.strokeStyle = "#bbb"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-300, -230); ctx.lineTo(-300, 230); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = PINK; rrect(-450, -230, 150, 460, [36, 0, 0, 36]); ctx.fill();
    ctx.restore();
    const tx = lerp(W + 700, W / 2, k) + 70, rot = lerp(.4, -.035, k);
    text("🎟️ כרטיס כניסה", tx, 900, { size: 66, color: "#666", rot });
    text("ילד + הורה", tx, 1030, { size: 130, color: INK, rot });
    text("זוג אחד = כרטיס אחד", tx, 1160, { size: 54, font: "Heebo", color: PINK, rot });
    text("27.10", lerp(W + 700, W / 2, k) - 375, 1060, { size: 64, color: WHITE, rot: rot - Math.PI / 2 });
  }
  tag("לפחות הורה 1 משתתף עם הילד!", W / 2, 1480, { size: 70, bg: PINK, fg: WHITE, scale: pop(s, 5 * B), rot: .02 });
  text("לא צופים מהצד — נכנסים לפעולה 💪", W / 2, 1650, { size: 56, font: "Heebo", color: INK, alpha: seg(s, 6 * B, 6 * B + .2) });
});
function ticketPath(ox, oy) {
  const w = 900, h = 460, r = 36, n = 34;
  ctx.moveTo(-w / 2 + r + ox, -h / 2 + oy);
  ctx.lineTo(w / 2 - r + ox, -h / 2 + oy); ctx.arcTo(w / 2 + ox, -h / 2 + oy, w / 2 + ox, -h / 2 + r + oy, r);
  ctx.lineTo(w / 2 + ox, -n + oy); ctx.arc(w / 2 + ox, oy, n, -Math.PI / 2, Math.PI / 2, true);
  ctx.lineTo(w / 2 + ox, h / 2 - r + oy); ctx.arcTo(w / 2 + ox, h / 2 + oy, w / 2 - r + ox, h / 2 + oy, r);
  ctx.lineTo(-w / 2 + r + ox, h / 2 + oy); ctx.arcTo(-w / 2 + ox, h / 2 + oy, -w / 2 + ox, h / 2 - r + oy, r);
  ctx.lineTo(-w / 2 + ox, n + oy); ctx.arc(-w / 2 + ox, oy, n, Math.PI / 2, -Math.PI / 2, true);
  ctx.lineTo(-w / 2 + ox, -h / 2 + r + oy); ctx.arcTo(-w / 2 + ox, -h / 2 + oy, -w / 2 + r + ox, -h / 2 + oy, r);
  ctx.closePath();
}
// 8. WHAT YOU GET
cut(2, (s, t) => {
  bg(PURPLE, t, "dots", WHITE);
  text("מה מחכה לכם?", W / 2, 420, { size: 120, scale: pop(s, 0) });
  const items = ["פעילות סודית הורה–ילד 🤫", "חגיגה לכל החוגגים 🎉", "הפתעות שאסור לפספס 🎁"];
  items.forEach((it, i) => {
    const a = 1.5 * B + i * 1.5 * B, k = easeBack(seg(s, a, a + .3)), y = 760 + i * 250;
    ctx.save(); ctx.globalAlpha = clamp(k); ctx.translate(lerp(W + 600, W / 2, k), y);
    ctx.fillStyle = "rgba(0,0,0,.85)"; rrect(-460 + 12, -95 + 12, 920, 190, 30); ctx.fill();
    ctx.fillStyle = WHITE; rrect(-460, -95, 920, 190, 30); ctx.fill();
    ctx.fillStyle = GREEN; rrect(300, -70, 140, 140, 70); ctx.fill();
    ctx.restore();
    const x = lerp(W + 600, W / 2, k);
    text("✓", x + 370, y + 4, { size: 100, color: WHITE, scale: pop(s, a + .15, .2) });
    text(it, x + 250, y, { size: 58, color: INK, align: "right", alpha: clamp(k) });
  });
});
// 9. CTA — tap to RSVP
cut(2, (s, t) => {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, PINK); g.addColorStop(1, PURPLE);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); stripes(t, WHITE, .06);
  tag("נתראה ב־", W / 2, 300, { size: 96, bg: INK, fg: WHITE, scale: pop(s, 0), rot: -.04 });
  text(CONFIG.date, W / 2, 560, { size: 300, color: NEON, scale: pop(s, .1, .3) * beatPulse(t), stroke: INK, strokeW: 18 });
  text(CONFIG.day, W / 2, 770, { size: 80, alpha: seg(s, B, B + .15) });
  const when = [CONFIG.time && ("בשעה " + CONFIG.time), CONFIG.place].filter(Boolean).join(" · ") || "שעה ומקום — בקבוצת הכיתה";
  text(when, W / 2, 890, { size: 54, font: "Heebo", alpha: seg(s, 1.5 * B, 1.5 * B + .15) });
  text(CONFIG.names.join(" · "), W / 2, 1010, { size: 54, font: "Heebo", color: NEON, alpha: seg(s, 2 * B, 2 * B + .15) });
  // RSVP button with finger tap
  const tapT = 3.5 * B, tapped = s >= tapT;
  const bk = pop(s, 2.5 * B, .3), press = tapped ? 1 - .08 * Math.exp(-(s - tapT) * 10) : 1;
  ctx.save(); ctx.translate(W / 2, 1390); ctx.scale(bk * press * (tapped ? 1 : beatPulse(t)), bk * press);
  ctx.fillStyle = "rgba(0,0,0,.85)"; rrect(-400 + 14, -110 + 14, 800, 220, 110); ctx.fill();
  ctx.fillStyle = tapped ? GREEN : NEON; rrect(-400, -110, 800, 220, 110); ctx.fill();
  ctx.restore();
  text(tapped ? "אנחנו מגיעים! 🙌" : "אנחנו בפנים? 👈", W / 2, 1394, { size: 86, color: INK, scale: bk * press });
  if (tapped) { // ripple
    const rk = seg(s, tapT, tapT + .6);
    ctx.strokeStyle = `rgba(255,255,255,${1 - rk})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(W / 2 + 120, 1420, 40 + rk * 380, 0, 6.28); ctx.stroke();
  }
  const fk = seg(s, 2.8 * B, tapT), fy = lerp(1900, 1450, easeOut(fk)) + (tapped ? 20 * Math.exp(-(s - tapT) * 8) : 0);
  text("👆", W / 2 + 140, fy + 70, { size: 150, alpha: fk > 0 ? 1 - seg(s, tapT + .8, tapT + 1.1) : 0 });
  tag("ילד + הורה = צוות מנצח 💪", W / 2, 1700, { size: 64, bg: WHITE, fg: INK, scale: pop(s, tapT + .5), rot: .03 });
});

// ---------- master ----------
function storyBar(t) {
  const n = CUTS.length, gap = 10, w = (W - 60 - gap * (n - 1)) / n;
  CUTS.forEach((c, i) => {
    const x = W - 30 - (i + 1) * w - i * gap; // RTL: fills right → left

  const e = seg(t, DURATION - .45, DURATION);
  if (e > 0) { ctx.fillStyle = `rgba(0,0,0,${e})`; ctx.fillRect(0, 0, W, H); }
}

window.DURATION = DURATION;
window.render = render;
window.ready = document.fonts.load('700 40px Rubik', 'א27').then(() => Promise.all([
  document.fonts.load('500 40px Heebo', 'א27'), document.fonts.load('700 40px Heebo', 'א27'),

}
