[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio2prompt"
version = "0.1.0"
description = "Decompose an audio file into tempo, key, chords, melody, timbre and structure, and build a Suno-ready style prompt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.optional-dependencies]
separation = ["demucs>=4.0"]

[project.scripts]
audio2prompt = "audio2prompt.cli:main"
audio2prompt-web = "audio2prompt.webapp:main"

[tool.setuptools.packages.find]
include = ["audio2prompt*"]
