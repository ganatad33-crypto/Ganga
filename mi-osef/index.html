<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171C26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מי אוסף">
<meta name="description" content="הלוז השבועי של המשפחה — מי אוסף כל ילד, בכל יום.">
<title>מי אוסף</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- מסך כניסה: טלפון → קוד SMS. במצב הדגמה נכנסים בלחיצה אחת. -->
<div class="gate" id="gate" hidden>
  <div>
    <div class="mark">מי אוסף<i>?</i></div>
    <div class="strip" id="gateStrip"></div>
  </div>
  <p class="sub" id="gateSub">הלוז השבועי של המשפחה — מי אוסף כל ילד, בכל יום.
    אבא ביום ראשון, אמא ביום שני, סבתא ביום שלישי, וכשאין אף אחד — האפליקציה אומרת את זה בזמן.</p>
  <div id="gateBody"></div>
</div>

<!-- האפליקציה -->
<div class="app" id="app" hidden>
  <div class="demo" id="demoBar" hidden>מצב הדגמה — הנתונים נשמרים במכשיר הזה בלבד</div>
  <div class="offline" id="offBar" hidden>אין חיבור — העדכונים יישלחו כשהרשת תחזור</div>

  <div class="chrome">
    <div class="chrome-row">
      <div class="brand">מי אוסף<i>?</i><small id="brandSub"></small></div>
      <div class="chrome-acts">
        <button class="sync" id="syncChip" data-act="help" data-k="sync">יומן</button>
        <button class="bell" id="bell" data-act="feed" aria-label="עדכונים">🔔</button>
        <button class="bell" data-act="settings" aria-label="הגדרות">⚙</button>
      </div>
    </div>
    <div class="famrow" id="famrow"></div>
  </div>
  <div class="linestrip" id="linestrip"></div>

  <main class="view" id="view">
    <div class="center"><div class="spin"></div><span>טוען את הלוז…</span></div>
  </main>

  <button class="fab" id="fab" aria-label="הוספה">+</button>
  <nav class="tabbar" id="tabbar" role="tablist"></nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/push.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
